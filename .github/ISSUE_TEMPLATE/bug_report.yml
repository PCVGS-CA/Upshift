name: Bug report
description: Something went wrong in Upshift (a crash, an error, an install or update that didn't work).
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please don't use Upshift with online or anti-cheat games; it blocks them, and problems with them won't be looked at.

        **Please attach Upshift's problem report.** In Upshift, open the game's panel and press **Report a problem with this game** (or **About > Report a problem** if it isn't about one game). It saves a zip file to your Desktop with your Upshift and Windows versions, graphics cards, logs and the game's OptiScaler details, with your Windows user name taken out of paths. Nothing is sent: drag the file into the "Problem report" box below.
  - type: input
    id: version
    attributes:
      label: Upshift version
      description: Shown on the About page, e.g. 1.2.0.
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics card
      description: Shown at the top of Settings, e.g. NVIDIA GeForce RTX 4070 (it's also in the problem report).
      placeholder: "NVIDIA GeForce RTX 4070, driver 32.0.15.xxxx"
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game
      description: The game it happened with, if any.
      placeholder: "The Witcher 3: Wild Hunt"
  - type: dropdown
    id: store
    attributes:
      label: Store
      description: Where the game comes from.
      options:
        - Steam
        - Epic Games
        - GOG
        - Xbox app / Game Pass
        - EA app
        - Ubisoft Connect
        - Battle.net
        - Heroic
        - itch.io
        - Other / added by hand
        - Not about a game
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots are welcome.
      placeholder: |
        1. Selected the game and clicked Install OptiScaler
        2. ...
        Expected: ...
        What happened: ...
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Problem report
      description: |
        Drag the `Upshift-report-….zip` file from your Desktop into this box (see the top of this form for how to make it). If you can't, attach the day's log from `%LocalAppData%\Upshift\logs` instead (paste that into the Explorer address bar), after removing your Windows user name from paths.
